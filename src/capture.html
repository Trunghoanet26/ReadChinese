<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: file:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<style>
  body.off { visibility: hidden; }
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; }
  #mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); }
  /* selection: clip-path on a bright copy of the image -> no image re-assignment on every mouse move */
  #lit { position: fixed; inset: 0; width: 100%; height: 100%; clip-path: inset(0 100% 100% 0); will-change: clip-path; }
  #sel { position: fixed; display: none; border: 1.5px solid #7c5cff; box-shadow: 0 0 0 1px rgba(255,255,255,.4);
         left: 0; top: 0; will-change: transform; pointer-events: none; }
  #size { position: fixed; left: 0; top: 0; display: none; font: 12px system-ui; color: #fff; background: #7c5cff;
          padding: 2px 6px; border-radius: 4px; }
  #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); font: 13px system-ui;
          color: #fff; background: rgba(0,0,0,.6); padding: 6px 12px; border-radius: 6px; }
</style>
</head>
<body>
<img id="bg" alt="">
<div id="mask"></div>
<img id="lit" alt="">
<div id="sel"></div>
<div id="size"></div>
<div id="hint">Drag to select the Chinese text · Esc / right-click to cancel</div>
<script>
  const bg = document.getElementById('bg');
  const lit = document.getElementById('lit');
  const sel = document.getElementById('sel');
  const size = document.getElementById('size');
  const hint = document.getElementById('hint');
  let start = null, rect = null, active = false, pending = null, raf = 0;

  function reset() {
    active = false; start = null; rect = null; pending = null;
    sel.style.display = 'none'; size.style.display = 'none'; hint.style.display = '';
    lit.style.clipPath = 'inset(0 100% 100% 0)';
    document.body.classList.remove('off');
  }

  window.api.onCaptureImage(async (dataUrl) => {
    reset();
    bg.src = dataUrl;
    lit.src = dataUrl;
    try { await Promise.all([bg.decode(), lit.decode()]); } catch { /* continue anyway */ }
    // wait two frames so the image is surely painted before the window is shown
    requestAnimationFrame(() => requestAnimationFrame(() => { active = true; window.api.captureReady(); }));
  });
  window.api.onCaptureReset(() => { reset(); bg.removeAttribute('src'); lit.removeAttribute('src'); });

  const finish = (r) => {
    if (!active) return;
    active = false;
    cancelAnimationFrame(raf);
    document.body.classList.add('off'); // hide immediately, do not wait for the main process
    window.api.captureDone(r);
  };
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') finish(null); });
  document.addEventListener('contextmenu', (e) => { e.preventDefault(); finish(null); });

  document.addEventListener('mousedown', (e) => {
    if (e.button !== 0 || !active) return;
    start = { x: e.clientX, y: e.clientY };
    hint.style.display = 'none';
  });
  function draw() {
    raf = 0;
    if (!pending) return;
    const { x, y, w, h } = pending;
    lit.style.clipPath = `inset(${y}px ${innerWidth - x - w}px ${innerHeight - y - h}px ${x}px)`;
    sel.style.transform = `translate(${x - 1.5}px, ${y - 1.5}px)`;
    sel.style.width = (w + 3) + 'px';
    sel.style.height = (h + 3) + 'px';
    sel.style.display = 'block';
    size.style.transform = `translate(${x}px, ${Math.max(0, y - 22)}px)`;
    size.style.display = 'block';
    size.textContent = `${w} × ${h}`;
  }
  // coalesce mouse moves per animation frame -> smooth, no jank
  document.addEventListener('mousemove', (e) => {
    if (!start) return;
    const x = Math.min(start.x, e.clientX), y = Math.min(start.y, e.clientY);
    const w = Math.abs(e.clientX - start.x), h = Math.abs(e.clientY - start.y);
    rect = { x, y, width: w, height: h };
    pending = { x, y, w, h };
    if (!raf) raf = requestAnimationFrame(draw);
  });
  document.addEventListener('mouseup', (e) => {
    if (e.button !== 0 || !start) return;
    start = null;
    finish(rect);
  });
</script>
</body>
</html>
